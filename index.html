<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Activité : Dimensions dans l'Univers</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Empêche le scroll inutile */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* On force le lecteur Ruffle à remplir tout l'écran */
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }

        .loading {
            color: white;
            position: absolute;
            text-align: center;
            font-family: sans-serif;
            font-size: 1.1rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Chargement de l'activité...</div>
    <div id="container"></div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();

            // CONFIGURATION CRUCIALE : on force le fit (ajustement)
            const player = ruffle.createPlayer();
            const container = document.getElementById("container");
            container.appendChild(player);

            // On force le style du player pour qu'il occupe tout l'espace
            player.style.width = "100%";
            player.style.height = "100%";

            player.load("Activité_doc1_DimensionsDansUnivers.swf").then(() => {
                document.getElementById("loading").style.display = "none";
            }).catch((e) => {
                document.getElementById("loading").innerHTML = "Erreur : Fichier introuvable.";
                console.error(e);
            });
        });
    </script>
</body>
</html>
